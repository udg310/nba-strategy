<body>
<header class="top"><div class="shell topinner">
  <button type="button" class="brand" data-page="home" aria-label="稻香 首页"><span class="brandmark"><canvas class="icon" data-icon="ball" aria-hidden="true"></canvas></span><span class="brandword">稻香</span></button>
  <nav class="nav" aria-label="主导航"><button type="button" data-page="home" aria-current="page"><canvas class="icon" data-icon="grid"></canvas>交易总览</button><button type="button" data-page="history"><canvas class="icon" data-icon="history"></canvas>历史交易</button></nav>
  <div class="envBox"><span class="chip"><span class="dot"></span>演示数据</span><select class="envselect" id="environment" aria-label="展示账户"><option value="live">实盘视图</option><option value="paper">模拟盘视图</option></select></div>
</div></header>
<main class="shell page">
  <div class="hero"><div><div class="context">NBA Trading Desk</div><h1 id="heading">交易总览</h1><div class="heroMeta"><span id="dayLabel"></span><span class="divider">/</span><span>香港时间</span><span class="num" id="clock"></span></div></div>
  <div class="headActions"><span class="replayStatus" id="status"><i class="dot"></i>SSE 演示就绪</span><button type="button" class="action" id="play" aria-pressed="false"><canvas class="icon" data-icon="play"></canvas><span>播放成交推送</span></button></div></div>
  <section id="dashboard" aria-label="交易总览">
    <div class="metrics" id="metrics"></div>
    <section class="panel" style="margin-bottom:18px"><div class="panelhead"><h2>进行中比赛盈亏</h2><span class="unit">演示数据 · USD</span></div><div class="demoGames" id="demoGames"></div></section>
    <div class="middle">
      <section class="panel chartPanel"><div class="charthead"><div><h2>盈亏走势</h2><div class="chartLegend">累计盈亏 · USD</div></div><div class="ranges" id="ranges" aria-label="选择走势范围"><button aria-pressed="true" data-range="1">今日</button><button aria-pressed="false" data-range="7">7 天</button><button aria-pressed="false" data-range="30">30 天</button><button aria-pressed="false" data-range="all">全部</button></div></div>
      <div class="plotWrap"><canvas class="plot" id="chart" tabindex="0" aria-label="累计盈亏走势图，左右方向键可查看数据点"></canvas><div id="tip" class="tooltip" hidden></div></div></section>
      <section class="panel side"><div class="panelhead"><div class="rowtitle"><h2>当前持仓</h2><span class="count" id="posCount">0</span></div><span class="unit">未实现盈亏 / USD</span></div><div class="positions" id="positions"></div><div class="positionsFoot" id="posFoot"></div></section>
    </div>
  </section>
  <section class="panel tradepanel"><div class="panelhead"><div class="rowtitle"><h2 id="ledgerTitle">今日交易</h2><span class="count" id="tradeCount">0</span></div>
  <div class="filters"><label id="dateWrap" hidden><span class="sr">历史交易日期</span><input type="date" id="historyDate"></label><label><span class="sr">交易类型</span><select id="kind"><option value="all">全部类型</option><option value="buy">买入</option><option value="sell">卖出</option><option value="settle">结算</option></select></label><button class="linkBtn" type="button" id="goHistory" data-page="history">历史交易<canvas class="icon" data-icon="arrow"></canvas></button></div></div>
  <div class="tablebox"><table class="ledger"><thead><tr><th>香港时间</th><th>交易</th><th>比赛 / 标的</th><th class="amount">成交价</th><th class="amount">份额</th><th class="amount deskcol">成交额</th><th class="amount deskcol">手续费</th><th class="amount mobileHide">净收付</th></tr></thead><tbody id="trades"></tbody></table></div><div class="empty" id="empty" hidden></div></section>
  <footer class="footer"><span>稻香 · NBA 交易看板</span><span>本地演示数据 · 美元计价 · 香港时间 UTC+8</span></footer>
</main>
<dialog id="detail" aria-labelledby="detailTitle"><div class="modalhead"><h2 id="detailTitle"></h2><button class="close" id="closeDetail" aria-label="关闭详情">×</button></div><div id="detailBody" class="modalbody"></div><div class="modalfoot"><button class="outline" id="done">关闭</button></div></dialog>
<div id="notice" role="status" class="toast" hidden></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const DAY = 86400000, HK = 8 * 3600000;
const dayStart = t => Math.floor((t + HK) / DAY) * DAY - HK;
const dayKey = t => new Date(t + HK).toISOString().slice(0, 10);
const timeFmt = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const headerDate = new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'long',day:'numeric',weekday:'long'});
const money = cents => (Math.abs(cents)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const signed = cents => (cents > 0 ? '+' : cents < 0 ? '−' : '') + '$' + money(cents);
const colorClass = val => val < 0 ? 'negative' : val > 0 ? 'positive' : '';
const names = {buy:'买入', sell:'卖出', settle:'结算'};
const teams = [
  {abbr:'GSW',name:'勇士',opponent:'太阳',ch:'A',color:'gs',base:42,trend:23},
  {abbr:'BOS',name:'凯尔特人',opponent:'热火',ch:'C',color:'bos',base:49,trend:12},
  {abbr:'LAL',name:'湖人',opponent:'掘金',ch:'D',color:'lal',base:55,trend:-8},
  {abbr:'NYK',name:'尼克斯',opponent:'篮网',ch:'D',color:'ny',base:50,trend:0}
];
const states = {};
let env='live', page='home', range='1', model, selectedDay, filter='all', playing=false, timer, toastTimer, hovered=null, chartGeometry, detailRef=null, lastFlash=null;
const startTime=Date.now();
let businessDay=dayKey(startTime);

// All prices and cash amounts use integer US cents; the fixtures never leave the browser.
function add(st, when, id, team, kind, quantity, price) {
  const gross=quantity*price;
  const fee=kind==='quote' ? 0 : Math.round(gross*0.0015);
  const item={seq:++st.seq,when,id,team,kind,quantity,price,gross,fee};
  st.events.push(item);
  return item;
}
function seed(mode,now) {
  const st={seq:0,events:[],replays:0}, day=dayStart(now), scale=mode==='paper'?0.48:1;
  const size=n=>Math.max(1,Math.round(n*scale));
  for(let d=29;d>=1;d--) {
    const t=day-d*DAY,i=d%3,id='old-'+d,price=36+(d*7)%24;
    const edge=d%5===0 ? -9 : 6+(d*5)%17;
    add(st,t+9*3600000,id,i,'buy',size(180+(d*23)%230),price);
    add(st,t+12*3600000+d*45000,id,i,'sell',size(180+(d*23)%230),price+edge);
  }
  add(st,day-3600000,'active-0',0,'buy',size(430),40);
  add(st,day-120000,'active-0',0,'quote',0,42);
  const span=Math.max(0,(now-day)*0.975);
  const stamp=f=>day+Math.floor(span*f);
  const wave=[0,2,1,-1,-3,-1,1,4,3,2,1,3];
  function mark(i,n){
    const t=n/60,swing=wave[(n+i*3)%wave.length];
    return Math.max(5,Math.min(95,Math.round(teams[i].base+teams[i].trend*t+swing+2*Math.sin(n*.39+i))));
  }
  for(let i=0;i<3;i++) add(st,stamp(.025+i*.008),'active-'+i,i,'buy',size(210+i*65),teams[i].base);
  add(st,stamp(.09),'settled',3,'buy',size(66),47);
  for(let n=4;n<=60;n++) {
    for(let i=0;i<3;i++) add(st,stamp(n/60),'active-'+i,i,'quote',0,mark(i,n));
    if(n%2===0 && n<58) {
      const i=(n/2)%3, kind=n%8===0?'sell':'buy';
      add(st,stamp(n/60),'active-'+i,i,kind,size(kind==='sell'?24+n:18+n%12),mark(i,n));
    }
  }
  add(st,stamp(.89),'settled',3,'settle',size(66),100);
  return st;
}
function calculate(st,now) {
  const boundary=dayStart(now), positions=new Map(),trades=[],points=[];
  const events=st.events.slice().sort((a,b)=>a.when-b.when || a.seq-b.seq);
  let realized=0,baseline=0,openPnl=0,dayStarted=false;
  for(const e of events) {
    if(e.when>=boundary && !dayStarted){baseline=realized+openPnl;dayStarted=true}
    let p=positions.get(e.id);
    if(!p){p={id:e.id,team:e.team,qty:0,cost:0,real:0,mark:e.price,buyGross:0,buyQty:0,trades:[],dayBase:0,first:e.when};positions.set(e.id,p)}
    openPnl-=p.qty*p.mark-p.cost;
    if(e.kind==='buy'){
      p.cost+=e.gross+e.fee;p.qty+=e.quantity;p.buyGross+=e.gross;p.buyQty+=e.quantity;
    } else if(e.kind==='sell'||e.kind==='settle'){
      const released=e.quantity===p.qty?p.cost:Math.round(p.cost*e.quantity/p.qty);
      const net=e.gross-e.fee-released;
      p.cost-=released;p.qty-=e.quantity;p.real+=net;realized+=net;
    }
    p.mark=e.price;p.last=e.when;
    openPnl+=p.qty*p.mark-p.cost;
    if(e.kind!=='quote'){p.trades.push(e);trades.push(e)}
    if(e.when<boundary){p.dayBase=p.real+p.qty*p.mark-p.cost;baseline=realized+openPnl}
    points.push({t:e.when,real:realized,unreal:openPnl,total:realized+openPnl});
  }
  const last=points[points.length-1] || {real:0,unreal:0,total:0};
  return {positions, trades:trades.reverse(),points, summary:{...last,today:last.total-baseline},baseline};
}

function canvasSetup(c){
  const box=c.getBoundingClientRect(),dpr=Math.min(3,window.devicePixelRatio||1);
  if(box.width<1||box.height<1)return null;
  const w=Math.round(box.width*dpr),h=Math.round(box.height*dpr);
  if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,box.width,box.height);
  return {ctx,w:box.width,h:box.height};
}
function icons(){
  document.querySelectorAll('canvas[data-icon]').forEach(c=>{
    const g=canvasSetup(c);if(!g)return;
    const {ctx,w,h}=g;ctx.save();ctx.scale(w/24,h/24);
    ctx.strokeStyle=getComputedStyle(c).color;ctx.lineWidth=1.75;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(new Path2D(paths[c.dataset.icon]));ctx.restore();
  });
}

function displaySeries(){
  const now=Date.now(),boundary=dayStart(now);
  const start=range==='all'?(model.points[0]?.t||boundary):boundary-(Number(range)-1)*DAY;
  const previous=model.points.filter(v=>v.t<start).at(-1)||{total:0,real:0,unreal:0};
  const result=[{...previous,t:start}];
  for(const point of model.points){
    if(point.t<start)continue;
    if(result.at(-1).t===point.t)result[result.length-1]=point;
    else result.push(point);
  }
  if(result.at(-1).t<now)result.push({...result.at(-1),t:now});
  return result;
}
function plotChart(){
  if(page!=='home')return;
  const g=canvasSetup($('chart'));if(!g)return;
  const {ctx,w,h}=g,series=displaySeries(),l=48,r=w-9,top=12,b=h-23;
  const vals=series.map(v=>v.total/100);
  const rawMin=Math.min(...vals),rawMax=Math.max(...vals),span=Math.max(rawMax-rawMin,1);
  const magnitude=Math.pow(10,Math.floor(Math.log10(span/3)));
  const step=([1,2,2.5,5,10].find(k=>k*magnitude>=span/3)||10)*magnitude;
  let min=Math.floor(rawMin/step)*step,max=Math.ceil(rawMax/step)*step;if(min===max)max+=step;
  const first=series[0].t,last=series.at(-1).t;
  const x=t=>l+(r-l)*(t-first)/Math.max(1,last-first), y=v=>b-(b-top)*(v-min)/(max-min);
  ctx.font='10px Consolas,monospace';ctx.textAlign='right';ctx.textBaseline='middle';ctx.lineWidth=1;ctx.setLineDash([3,5]);
  for(let v=min;v<=max+.001;v+=step){const py=y(v);ctx.strokeStyle='#455248';ctx.beginPath();ctx.moveTo(l,py);ctx.lineTo(r,py);ctx.stroke();ctx.fillStyle='#bcc8ba';ctx.fillText((v<0?'−$':'$')+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:1}),l-6,py)}
  ctx.setLineDash([]);ctx.textBaseline='alphabetic';const ticks=w<420?4:6;
  for(let i=0;i<ticks;i++){
    const t=first+(last-first)*i/(ticks-1);
    ctx.textAlign=i===0?'left':i===ticks-1?'right':'center';ctx.fillText(range==='1'?timeFmt.format(t).slice(0,5):dayKey(t).slice(5),x(t),h-4);
  }
  const line=new Path2D();series.forEach((p,i)=>{if(i===0)line.moveTo(x(p.t),y(p.total/100));else line.lineTo(x(p.t),y(p.total/100))});
  const area=new Path2D(line);area.lineTo(r,b);area.lineTo(l,b);area.closePath();
  const gradient=ctx.createLinearGradient(0,top,0,b);gradient.addColorStop(0,'rgba(242,150,87,.35)');gradient.addColorStop(1,'rgba(242,150,87,.015)');ctx.fillStyle=gradient;ctx.fill(area);
  ctx.strokeStyle='#ff9e64';ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.stroke(line);
  const idx=hovered===null?series.length-1:Math.max(0,Math.min(series.length-1,hovered));
  const pt=series[idx],px=x(pt.t),py=y(pt.total/100);
  if(hovered!==null){ctx.setLineDash([4,4]);ctx.strokeStyle='#b7bfaf';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px,top);ctx.lineTo(px,b);ctx.stroke();ctx.setLineDash([])}
  ctx.fillStyle='#ffaf7c';ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
  chartGeometry={series,x};
  const tip=$('tip');tip.hidden=hovered===null;
  if(!tip.hidden){tip.textContent=dayKey(pt.t).slice(5)+' '+timeFmt.format(pt.t)+'\n累计 '+signed(pt.total)+'\n已实现 '+signed(pt.real)+'\n未实现 '+signed(pt.unreal);tip.style.left=Math.max(0,Math.min(w-135,px+9))+'px';tip.style.top=Math.max(0,Math.min(h-89,py-50))+'px'}
}
function drawSparks(){
  const pts=model.points.filter(p=>p.t>=dayStart(Date.now()));
  document.querySelectorAll('canvas[data-spark]').forEach(c=>{
    const g=canvasSetup(c);if(!g)return;
    const {ctx,w,h}=g,key=c.dataset.spark,vals=pts.map(p=>key==='today'?p.total-model.baseline:p[key]);
    if(!vals.length)vals.push(0,0);
    const low=Math.min(...vals),high=Math.max(...vals);ctx.beginPath();
    const increment=Math.max(1,Math.floor(vals.length/27));
    for(let i=0;i<vals.length;i++){if(i%increment && i!==vals.length-1)continue;const x=1+(w-2)*i/Math.max(1,vals.length-1),y=h-3-(h-6)*(vals[i]-low)/Math.max(1,high-low);if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
    ctx.lineWidth=1.6;ctx.strokeStyle=key==='today'?'#ce7039':'#809882';ctx.lineJoin='round';ctx.stroke();
  });
}
function field(label,value){return '<div><small>'+label+'</small><strong>'+value+'</strong></div>'}

function openPosition(p){

  const rows=p.trades.slice().reverse().map(e=>'<div class="detailItem"><span><span class="kind '+e.kind+'">'+names[e.kind]+'</span> '+dayKey(e.when).slice(5)+' '+timeFmt.format(e.when)+'</span><button class="linkBtn" data-show-trade="'+e.seq+'">'+e.quantity+' 份 · $'+money(e.price)+' ›</button></div>').join('');
  displayDialog(t.name+' 胜 · 仓位详情','<p>'+t.name+' vs '+t.opponent+' · '+t.ch+' 通道</p><div class="detailGrid">'+grid+'</div><h3>仓位流水</h3>'+rows);

function openTrade(e){
  const t=teams[e.team];
  const grid=field('动作',names[e.kind])+field('通道',t.ch)+field(e.kind==='settle'?'每份兑付':'成交价 / 份','$'+money(e.price))+field('数量',e.quantity+' 份')+field('金额','$'+money(e.gross))+field('实际手续费','$'+money(e.fee))+field('净收付',signed(netCash(e)))+field('记录来源','本地演示');
  displayDialog(names[e.kind]+'明细','<p><strong>'+t.name+' vs '+t.opponent+'</strong> · '+t.name+' 胜</p><p class="sub">'+dayKey(e.when)+' '+timeFmt.format(e.when)+' · 香港时间 · 演示记录时间</p><div class="detailGrid">'+grid+'</div><div class="detailItem"><span class="muted">演示流水号</span><span class="num">DEMO-'+env.toUpperCase()+'-'+e.seq+'</span></div><button class="linkBtn" data-pos="'+e.id+'">查看该仓位全部交易 ›</button>');
}
function openMetric(key){
  const info=metricInfo.find(m=>m[0]===key),sum=model.summary;
  let html='<p class="sub">'+info[2]+' · USD · 演示数据</p><p class="metricValue num">'+signed(sum[key])+'</p>';
  if(key==='total')html+='<div class="detailGrid">'+field('已实现盈亏',signed(sum.real))+field('未实现盈亏',signed(sum.unreal))+'</div>';
  if(key==='today')html+='<div class="detailGrid">'+field('香港零点累计盈亏',signed(model.baseline))+field('当前累计盈亏',signed(sum.total))+'</div>';
  const contributions=[...model.positions.values()].map(p=>{
    const floating=p.qty*p.mark-p.cost;
    const val=key==='today'?p.real+floating-p.dayBase:key==='unreal'?floating:key==='real'?p.real:floating+p.real;
    return {p,val};
  }).filter(({p,val})=>key==='today'?val!==0||p.trades.some(t=>dayKey(t.when)===businessDay):key==='unreal'?p.qty>0:val!==0).sort((a,b)=>Math.abs(b.val)-Math.abs(a.val));
  html+='<h3>仓位贡献</h3>'+contributions.map(({p,val})=>'<div class="detailItem"><span>'+teams[p.team].name+' 胜 <span class="sub">'+dayKey(p.first)+' · '+(p.qty?'持仓中':'已平仓')+'</span></span><button class="linkBtn num '+colorClass(val)+'" data-pos="'+p.id+'">'+signed(val)+' ›</button></div>').join('');
  displayDialog(info[1],html);
}
function paintDetail(){
  if(!detailRef)return;
  if(detailRef.type==='position')openPosition(model.positions.get(detailRef.value));
  if(detailRef.type==='trade')openTrade(model.trades.find(e=>e.seq===Number(detailRef.value)));

function updateClock(now){

function render(){

  $('heading').textContent=home?'交易总览':'历史交易';$('ledgerTitle').textContent=home?'今日交易':'历史流水';

function notify(msg){

function checkDay(now){

  if(next===businessDay)return false;
  businessDay=next;selectedDay=dayKey(now-DAY);hovered=null;lastFlash=null;render();return true;

// Replay uses local synthetic records. No wallet, order endpoint, or server subscription is opened.
function replay(){
  const now=Date.now();checkDay(now);
  const st=states[env],n=st.replays++,i=n%3,id='active-'+i,p=model.positions.get(id);
  const kind=n%2===0&&p.qty>=8?'sell':'buy';
  const qty=kind==='sell'?Math.min(13+n%6,p.qty):18+n%9;
  const px=Math.max(3,Math.min(97,p.mark+(n%3===2?-2:2)));
  const row=add(st,now,id,i,kind,qty,px);lastFlash=row.seq;
  render();notify('演示推送 · '+teams[i].name+' 胜 · '+names[kind]+' '+qty+' 份');

function setPlaying(next){

  $('play').querySelector('canvas').dataset.icon=next?'pause':'play';
  $('status').classList.toggle('on',next);$('status').innerHTML='<i class="dot"></i>'+(next?'SSE 本地回放中':'SSE 演示就绪');
  if(next){replay();timer=setInterval(replay,8000)}else icons();

function navigate(target){

document.addEventListener('click',event=>{

  else if(target.dataset.pos)showDetail('position',target.dataset.pos);

for(const id of ['closeDetail','done'])$(id).addEventListener('click',()=>$('detail').close());
$('detail').addEventListener('close',()=>detailRef=null);
$('detail').addEventListener('click',e=>{if(e.target!==e.currentTarget)return;const b=e.currentTarget.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)e.currentTarget.close()});

  if(!chartGeometry)return;
  const px=e.clientX-e.currentTarget.getBoundingClientRect().left,{series,x}=chartGeometry;
  hovered=series.reduce((best,p,i)=>Math.abs(x(p.t)-px)<Math.abs(x(series[best].t)-px)?i:best,0);plotChart();

function clearHover(){hovered=null;plotChart()}
$('chart').addEventListener('pointerleave',clearHover);$('chart').addEventListener('blur',clearHover);
$('chart').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Escape'].includes(e.key))return;e.preventDefault();if(e.key==='Escape')return clearHover();const end=chartGeometry.series.length-1;hovered=Math.max(0,Math.min(end,(hovered===null?end:hovered)+(e.key==='ArrowLeft'?-1:1)));plotChart()});
new ResizeObserver(()=>{if(page==='home'){drawSparks();plotChart()}icons()}).observe(document.querySelector('.shell.page'));
setInterval(()=>{const now=Date.now();if(!checkDay(now))updateClock(now)},1000);
